<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reminder: SO.... How did we do?</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f6f8; font-family:Arial, Helvetica, sans-serif; color:#202124;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#f4f6f8; margin:0; padding:24px 0;">
    <tr>
      <td align="center" style="padding:0 12px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:680px; background-color:#ffffff; border:1px solid #d9dee7; border-radius:8px; overflow:hidden;">
          <tr>
            <td style="padding:30px 28px;">
              <p style="margin:0 0 18px; font-size:16px; line-height:24px;">Hi {{greeting_name}},</p>
              <p style="margin:0 0 16px; font-size:16px; line-height:24px;">Just a quick reminder to share your feedback on your recent experience with Spencer Ogden.</p>
              <p style="margin:0 0 16px; font-size:16px; line-height:24px;">We would really appreciate it if you could take a moment to answer one simple question using the link below.</p>
              <p style="margin:0 0 10px; font-size:16px; line-height:24px; font-weight:700;">{{question_text}}</p>
              {{scale_html}}
              <p style="margin:18px 0 0; font-size:16px; line-height:24px;">Thank you,<br>Spencer Ogden</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
