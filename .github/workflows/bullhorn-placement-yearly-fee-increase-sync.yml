name: Bullhorn Placement Yearly Fee Increase Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run placement yearly fee increase sync
        env:
          BULLHORN_CLIENT_ID: ${{ secrets.BULLHORN_CLIENT_ID }}
          BULLHORN_CLIENT_SECRET: ${{ secrets.BULLHORN_CLIENT_SECRET }}
          BULLHORN_USERNAME: ${{ secrets.BULLHORN_USERNAME }}
          BULLHORN_PASSWORD: ${{ secrets.BULLHORN_PASSWORD }}
          BULLHORN_REDIRECT_URI: ${{ secrets.BULLHORN_REDIRECT_URI }}
          DRY_RUN: ${{ secrets.DRY_RUN }}
          PLACEMENT_YEARLY_FEE_INCREASE_MONTH_OFFSET: ${{ secrets.PLACEMENT_YEARLY_FEE_INCREASE_MONTH_OFFSET }}
          PLACEMENT_YEARLY_FEE_INCREASE_QUERY_COUNT: ${{ secrets.PLACEMENT_YEARLY_FEE_INCREASE_QUERY_COUNT }}
          PLACEMENT_YEARLY_FEE_INCREASE_WINDOW_BEFORE_DAYS: ${{ secrets.PLACEMENT_YEARLY_FEE_INCREASE_WINDOW_BEFORE_DAYS }}
          PLACEMENT_YEARLY_FEE_INCREASE_WINDOW_AFTER_DAYS: ${{ secrets.PLACEMENT_YEARLY_FEE_INCREASE_WINDOW_AFTER_DAYS }}
          PLACEMENT_YEARLY_FEE_INCREASE_SPARKPOST_TEMPLATE_ID: ${{ secrets.PLACEMENT_YEARLY_FEE_INCREASE_SPARKPOST_TEMPLATE_ID }}
          SPARKPOST_API_KEY: ${{ secrets.SPARKPOST_API_KEY }}
          SPARKPOST_TEMPLATE_ID: ${{ secrets.SPARKPOST_TEMPLATE_ID }}
        run: npm run run:placement-yearly-fee-increase-sync

      - name: Upload placement yearly fee increase reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bullhorn-placement-yearly-fee-increase-reports
          path: |
            reports/**/placement-yearly-fee-increase-report-*.json
            reports/**/placement-yearly-fee-increase-sparkpost-payload-*.json
          if-no-files-found: warn
