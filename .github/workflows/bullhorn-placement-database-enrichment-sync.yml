name: Bullhorn Placement Database Enrichment Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "1 0 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run placement database enrichment sync
        env:
          BULLHORN_CLIENT_ID: ${{ secrets.BULLHORN_CLIENT_ID }}
          BULLHORN_CLIENT_SECRET: ${{ secrets.BULLHORN_CLIENT_SECRET }}
          BULLHORN_USERNAME: ${{ secrets.BULLHORN_USERNAME }}
          BULLHORN_PASSWORD: ${{ secrets.BULLHORN_PASSWORD }}
          BULLHORN_REDIRECT_URI: ${{ secrets.BULLHORN_REDIRECT_URI }}
          DRY_RUN: ${{ secrets.DRY_RUN }}
          PLACEMENT_DATABASE_ENRICHMENT_QUERY_COUNT: ${{ secrets.PLACEMENT_DATABASE_ENRICHMENT_QUERY_COUNT }}
          PLACEMENT_DATABASE_ENRICHMENT_DAYS_BACK: ${{ secrets.PLACEMENT_DATABASE_ENRICHMENT_DAYS_BACK }}
        run: npm run run:placement-database-enrichment-sync

      - name: Upload placement database enrichment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bullhorn-placement-database-enrichment-report
          path: reports/**/placement-database-enrichment-report-*.json
          if-no-files-found: warn
