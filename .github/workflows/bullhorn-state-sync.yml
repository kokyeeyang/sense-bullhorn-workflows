name: Bullhorn Candidate State Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run workflow
        env:
          BULLHORN_CLIENT_ID: ${{ secrets.BULLHORN_CLIENT_ID }}
          BULLHORN_CLIENT_SECRET: ${{ secrets.BULLHORN_CLIENT_SECRET }}
          BULLHORN_USERNAME: ${{ secrets.BULLHORN_USERNAME }}
          BULLHORN_PASSWORD: ${{ secrets.BULLHORN_PASSWORD }}
          BULLHORN_AUTH_BASE_URL: ${{ secrets.BULLHORN_AUTH_BASE_URL }}
          BULLHORN_API_BASE_URL: ${{ secrets.BULLHORN_API_BASE_URL }}
          BULLHORN_REDIRECT_URI: ${{ secrets.BULLHORN_REDIRECT_URI }}
          BULLHORN_API_VERSION: ${{ secrets.BULLHORN_API_VERSION }}
          LOOKBACK_HOURS: ${{ secrets.LOOKBACK_HOURS }}
          DRY_RUN: ${{ secrets.DRY_RUN }}
          TEST_CANDIDATE_ID: ${{ secrets.TEST_CANDIDATE_ID }}
        run: npm run run:workflow

      - name: Upload changes report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bullhorn-changes-report
          path: reports/*.json
          if-no-files-found: warn
