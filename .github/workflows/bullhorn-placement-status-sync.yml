name: Bullhorn Placement Status Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run placement status sync
        env:
          BULLHORN_CLIENT_ID: ${{ secrets.BULLHORN_CLIENT_ID }}
          BULLHORN_CLIENT_SECRET: ${{ secrets.BULLHORN_CLIENT_SECRET }}
          BULLHORN_USERNAME: ${{ secrets.BULLHORN_USERNAME }}
          BULLHORN_PASSWORD: ${{ secrets.BULLHORN_PASSWORD }}
          BULLHORN_REDIRECT_URI: ${{ secrets.BULLHORN_REDIRECT_URI }}
          DRY_RUN: ${{ secrets.DRY_RUN }}
          PLACEMENT_EVENT_SUBSCRIPTION_ID: ${{ secrets.PLACEMENT_EVENT_SUBSCRIPTION_ID }}
          PLACEMENT_EVENT_MAX_EVENTS: ${{ secrets.PLACEMENT_EVENT_MAX_EVENTS }}
        run: npm run run:placement-status-sync

      - name: Upload placement changes report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bullhorn-placement-status-report
          path: reports/**/placement-status-report-*.json
          if-no-files-found: warn
