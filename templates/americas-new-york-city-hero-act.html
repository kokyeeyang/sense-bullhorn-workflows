<!doctype html>
<html lang="en">
<body style="margin:0;padding:0;background:#ffffff;color:#202124;font-family:Arial,sans-serif;">
  <div style="max-width:640px;margin:0 auto;padding:24px;">
    <p>Hello {{candidate_first_name}},</p>
    <p>Congratulations on starting your new role with {{client_company_name}}!</p>
    <p><strong>{{question_text}}</strong></p>
    <p style="margin:16px 0;">
      <a href="{{survey_url_yes}}" style="display:inline-block;margin-right:12px;padding:10px 16px;background:#1f7a1f;color:#ffffff;text-decoration:none;border-radius:4px;">Yes</a>
      <a href="{{survey_url_no}}" style="display:inline-block;padding:10px 16px;background:#b42318;color:#ffffff;text-decoration:none;border-radius:4px;">No</a>
    </p>
    <p>Thanks for choosing to work with Spencer Ogden.</p>
    <p>
      Regards,<br>
      {{candidate_owner_name}}
    </p>
  </div>
</body>
</html>
